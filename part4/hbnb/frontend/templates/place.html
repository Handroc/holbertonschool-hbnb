<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBnB - Place Details</title>
    <link rel="icon" href="../static/images/icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
</head>
<body>
    <header>
        <a href="index.html">
            <img src="../static/images/logo.png" alt="HBnB" class="logo">
        </a>
        <nav>
            <a href="index.html">Browse</a>
            <a href="notifications.html" id="notif-nav-link" class="hidden" aria-hidden="true" aria-label="Notifications"><span class="notif-bell-wrap">🔔<span id="notif-badge" class="notif-badge hidden" aria-hidden="true"></span></span></a>
            <a href="inbox.html" id="inbox-link" class="hidden" aria-hidden="true" title="Inbox">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle;"><rect x="2" y="4" width="20" height="16" rx="2" ry="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg>
                <span id="inbox-unread-badge" class="inbox-badge hidden" aria-hidden="true"></span>
            </a>
            <a href="login.html" class="login-button" id="login-link">Login</a>
            <a href="#" class="login-button hidden" id="logout-link" aria-hidden="true">Logout</a>
            <div class="nav-avatar-wrap hidden" id="nav-avatar-wrap" aria-hidden="true">
                <button class="nav-avatar-btn" id="nav-avatar-btn" aria-label="Account menu" aria-haspopup="menu" aria-expanded="false">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
                <div class="nav-dropdown" id="nav-dropdown" role="menu" aria-hidden="true">
                    <a href="inbox.html" id="inbox-menu-link" class="hidden" aria-hidden="true">Inbox <span id="inbox-menu-count" class="nav-menu-count hidden" aria-hidden="true"></span></a>
                    <a href="notifications.html" id="notif-menu-link" class="hidden" aria-hidden="true">Notifications <span id="notif-menu-count" class="nav-menu-count hidden" aria-hidden="true"></span></a>
                    <a href="add_place.html" id="add-place-link" class="hidden" aria-hidden="true">Add your own place</a>
                    <a href="profile.html">Profile</a>
                    <a href="my_places.html">My Places</a>
                    <a href="my_bookings.html">My Bookings</a>
                    <a href="saved_places.html">Saved Places</a>
                    <a href="admin.html" id="admin-nav-link" class="hidden" aria-hidden="true">Admin</a>
                    <a href="#" id="logout-menu-link" class="hidden" aria-hidden="true">Logout</a>
                </div>
            </div>
        </nav>
    </header>
            <main>
        <section id="place-gallery" class="hidden" aria-hidden="true"></section>
        
        <div class="place-layout-grid">
            <div class="place-main-column">
                <section id="place-details" class="place-details">
                    <!-- Place details will be populated dynamically -->
                </section>
                
                <section id="place-map-section" class="hidden" aria-hidden="true">
                    <div id="place-map"></div>
                </section>
                
                <section id="reviews">
                    <h2>Reviews</h2>
                    <!-- Review cards will be populated dynamically -->
                </section>
                
                <section id="add-review" class="add-review hidden" aria-hidden="true">
                    <h2>Add a Review</h2>
                    <form id="review-form" class="form">
                        <label for="review-text">Your Review:</label>
                        <textarea id="review-text" name="review-text" required></textarea>
                        
                        <fieldset class="form-fieldset review-categories-group">
                            <legend>Category Ratings (optional)</legend>
                            <div class="review-categories">
                            <div class="review-cat-row">
                                <label for="inline-rating">Overall Rating:</label>
                                <select id="inline-rating" name="rating" required>
                                    <option value="1">1 Star</option>
                                    <option value="2">2 Stars</option>
                                    <option value="3">3 Stars</option>
                                    <option value="4">4 Stars</option>
                                    <option value="5">5 Stars</option>
                                </select>
                            </div>
                            <div class="review-cat-row">
                                <label for="inline-cleanliness">Cleanliness:</label>
                                <select id="inline-cleanliness" name="cleanliness">
                                    <option value="">—</option>
                                    <option value="1">1</option><option value="2">2</option>
                                    <option value="3">3</option><option value="4">4</option><option value="5">5</option>
                                </select>
                            </div>
                            <div class="review-cat-row">
                                <label for="inline-location">Location:</label>
                                <select id="inline-location" name="location">
                                    <option value="">—</option>
                                    <option value="1">1</option><option value="2">2</option>
                                    <option value="3">3</option><option value="4">4</option><option value="5">5</option>
                                </select>
                            </div>
                            <div class="review-cat-row">
                                <label for="inline-value">Value:</label>
                                <select id="inline-value" name="value_score">
                                    <option value="">—</option>
                                    <option value="1">1</option><option value="2">2</option>
                                    <option value="3">3</option><option value="4">4</option><option value="5">5</option>
                                </select>
                            </div>
                            <div class="review-cat-row">
                                <label for="inline-comm">Communication:</label>
                                <select id="inline-comm" name="communication">
                                    <option value="">—</option>
                                    <option value="1">1</option><option value="2">2</option>
                                    <option value="3">3</option><option value="4">4</option><option value="5">5</option>
                                </select>
                            </div>
                            </div>
                        </fieldset>
                        <button type="submit" class="submit-review-btn">Submit Review</button>
                    </form>
                </section>
            </div>
            
            <aside class="place-sidebar">
                <section id="book-place" class="book-place auth-card place-booking-card hidden" aria-hidden="true">
                    <h2 class="place-booking-title">Book this Place</h2>
                    <form id="booking-form" class="form">
                        <label for="check-in">Check-in:</label>
                        <input type="date" id="check-in" required>
                        
                        <label for="check-out">Check-out:</label>
                        <input type="date" id="check-out" required>
                        
                        <button type="submit" class="place-booking-submit">Book Now</button>
                        
                        <p id="booking-error" class="form-feedback-error hidden" aria-live="polite" aria-hidden="true"></p>
                        <p id="booking-success" class="form-feedback-success hidden" aria-live="polite" aria-hidden="true"></p>
                    </form>
                </section>
            </aside>
        </div>
    </main>
    <footer>
        <p>&copy; 2025 HBnB. All rights reserved.</p>
    </footer>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="../static/js/utils.js"></script>
    <script src="../static/js/auth-dropdown.js"></script>
    <script src="../static/js/auth.js"></script>
    <script src="../static/js/pages/place.js"></script>
</body>
</html>
