<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBnB - Login</title>
    <link rel="icon" href="../static/images/icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/styles.css">
</head>
<body>
    <header>
        <a href="index.html">
            <img src="../static/images/logo.png" alt="HBnB" class="logo">
        </a>
        <nav>
            <a href="index.html">Browse</a>
            <a href="login.html" class="login-button">Login</a>
        </nav>
    </header>
    <main class="auth-layout">
        <div class="auth-card">
            <form id="login-form">
                <h2>Welcome back</h2>
                <p class="login-tagline">Sign in to continue planning your next stay.</p>
                <p class="login-helper">Use the email and password tied to your HBnB account.</p>
                <p id="login-error" class="form-feedback-error hidden" role="alert" aria-live="assertive" aria-hidden="true"></p>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="email" inputmode="email" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>

                <div class="login-support-row">
                    <p class="small-note login-help-text">Need help signing in? Contact your host admin.</p>
                    <a href="index.html" class="muted-inline-link">Back to browse</a>
                </div>

                <button type="submit" id="login-submit">Sign in</button>
            </form>
        </div>
    </main>
    <footer>
        <p>&copy; 2025 HBnB. All rights reserved.</p>
    </footer>
    <script src="../static/js/utils.js"></script>
    <script src="../static/js/auth-dropdown.js"></script>
    <script src="../static/js/auth.js"></script>
    <script src="../static/js/pages/login.js"></script>
</body>
</html>
